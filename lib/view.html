<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peers live</title>
<link rel="stylesheet" href="/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="/vendor/wunderbaum.css">
<link rel="stylesheet" href="/vendor/github-markdown.css">
<link rel="stylesheet" href="/vendor/hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/vendor/hljs-dark.css" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --mute: #6e6e73; --faint: #76767c; --line: #e4e1db; --code: #f2f0eb; --hover: #efede8;
  --a0: #2f6fdf; --a1: #d9480f; --a2: #2b8a3e; --a3: #ae3ec9; --a4: #c2255c; --a5: #1098ad; --a6: #e67700; --a7: #5f3dc4;
  --nobody: #8e8e93; --tint: 13%; --add: #2b8a3e; --del: #c92a2a;
  /* One type scale: 12 for meta, 13 for the UI, 14 for body text; weights 400, 500, 600 only. */
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  --fs-meta: 12px; --fs-ui: 13px; --fs-body: 14px; --fs-head: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113; --panel: #18181b; --ink: #ececf0; --mute: #9a9aa2; --faint: #8b8b94; --line: #2a2a2f; --code: #212125; --hover: #232328;
    --a0: #6ea2ff; --a1: #ff8a50; --a2: #5fd27a; --a3: #d68bf0; --a4: #ff6b9d; --a5: #4fd1e6; --a6: #ffb340; --a7: #a48bff;
    --tint: 20%; --add: #5fd27a; --del: #ff6b6b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs-ui)/1.5 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }
.mute { color: var(--mute); }
.faint { color: var(--faint); }

/* Shell: top bar, then tree | main | feed. */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top h1 { font-size: var(--fs-head); letter-spacing: -0.01em; font-weight: 600; margin: 0; display: flex; align-items: baseline; gap: 10px; }
.live { font-size: var(--fs-meta); font-weight: 400; color: var(--faint); }
.live.on { color: var(--add); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 3px 10px; cursor: pointer; color: var(--mute); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { color: var(--ink); background: var(--hover); font-weight: 500; }
.find kbd, .keys kbd, #help kbd { font: var(--fs-meta) var(--mono); color: var(--faint); }
.keys { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 9px; cursor: pointer; color: var(--mute); }
.find { margin-left: auto; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 10px; cursor: pointer; color: var(--mute); min-width: 200px; }
.app { display: grid; grid-template-columns: 300px 5px minmax(0, 1fr) 5px 300px; min-height: calc(100vh - 45px); }
/* A sash between columns, as VS Code's: a hairline that thickens to the accent on hover and drag. */
.sash { position: sticky; top: 45px; height: calc(100vh - 45px); cursor: col-resize; background: linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat; transition: background-size .15s, background-color .15s; touch-action: none; }
.sash:hover, .sash:active { background-image: linear-gradient(var(--a0), var(--a0)); background-size: 3px 100%; }
.rail { position: sticky; top: 45px; height: calc(100vh - 45px); overflow: auto; background: var(--panel); }
.left { display: flex; flex-direction: column; overflow: hidden; }
.right { padding: 12px 12px 40px; }
main { padding: 16px 24px 80px; min-width: 0; }
.label { font-size: var(--fs-meta); font-weight: 600; color: var(--mute); margin: 4px 0 8px; display: flex; align-items: center; gap: 8px; }

/* Legend: one chip per session. */
/* The session's color lives in its name only; a writing session's age reads "now". */
#legend { padding: 14px 12px 10px; border-bottom: 1px solid var(--line); max-height: 45%; overflow: auto; flex: none; }
.who { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.who.on { border-color: color-mix(in srgb, var(--c) 50%, transparent); }
.who.off { opacity: .45; }
.who b { font-weight: 600; color: var(--c); }
.who:hover b { text-decoration: underline; text-underline-offset: 3px; }
.who .doing { grid-column: 1 / 3; font-size: var(--fs-meta); color: var(--mute); overflow-wrap: anywhere; }
.who .meta { font-size: var(--fs-meta); color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.who .meta.now { color: var(--add); }

/* Tree (wunderbaum) themed from our tokens. */
.treebar { padding: 12px 14px 6px; flex: none; }
.treebar label { font-size: var(--fs-meta); color: var(--mute); display: flex; gap: 6px; align-items: center; cursor: pointer; }
#tree { flex: 1; min-height: 0; padding: 0 6px 24px; }
/* Unchanged files sit back in the muted color; a change reads in ink, so no marker is needed to find it. */
div.wunderbaum { --wb-font-stack: var(--sans); --wb-node-text-color: var(--mute); --wb-background-color: var(--panel); --wb-alternate-row-color: var(--panel); --wb-alternate-row-color-hover: var(--hover); --wb-hover-color: var(--hover); --wb-active-color: color-mix(in srgb, var(--a0) 14%, transparent); --wb-active-hover-color: color-mix(in srgb, var(--a0) 20%, transparent); --wb-active-border-color: transparent; --wb-active-hover-border-color: transparent; --wb-focus-border-color: transparent; --wb-border-color: var(--line); --wb-dim-color: var(--faint); --wb-active-color-grayscale: var(--hover); --wb-active-border-color-grayscale: transparent; --wb-active-hover-color-grayscale: var(--hover); --wb-row-outer-height: 26px; --wb-row-inner-height: 24px; --wb-icon-outer-width: 18px; border: 0; font-size: var(--fs-ui); height: 100%; }
div.wunderbaum .wb-row { border-radius: 5px; }
div.wunderbaum .wb-row.repo span.wb-title { color: var(--ink); font-weight: 600; }
div.wunderbaum span.wb-title { padding-left: 4px; }
div.wunderbaum span.wb-node { display: flex; align-items: center; min-width: 0; }
div.wunderbaum span.wb-node > i { flex: none; }
div.wunderbaum span.wb-title { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
div.wunderbaum i.wb-icon, div.wunderbaum i.wb-expander { color: var(--faint); }
.tn { margin-left: auto; padding: 0 8px 0 10px; display: flex; gap: 8px; align-items: center; font: var(--fs-meta) var(--mono); font-variant-numeric: tabular-nums; flex: none; }
.tn .ad { color: var(--add); } .tn .de { color: var(--del); }
.wb-row.fresh { animation: flash 2.4s ease-out; }
div.wunderbaum .wb-row.changed span.wb-title { color: var(--ink); font-weight: 500; }

/* Change kind as a plain letter, as git status and the pane write it: A added, M edited, D deleted (struck). */
.kd { font: 600 var(--fs-meta) var(--mono); flex: none; min-width: 1.2em; text-align: center; color: var(--mute); }
.kd.k-add { color: var(--add); }
.kd.k-delete { color: var(--del); text-decoration: line-through; }
:is(.path, .wb-title).k-delete .base, .wb-row.k-delete span.wb-title { text-decoration: line-through; color: var(--mute); }
.fi { width: 16px; height: 16px; flex: none; align-self: center; }
.file > summary .fi { align-self: flex-start; margin-top: 2px; }
div.wunderbaum i.wb-icon[style] { background-size: 16px; background-position: center; background-repeat: no-repeat; }

/* Overview: sessions > files > changes, each a <details>. */
:not(.wb-row).repo { font: 600 var(--fs-head) var(--mono); color: var(--ink); margin: 28px 0 10px; }
:not(.wb-row).repo:first-child { margin-top: 0; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.car { display: inline-block; width: 12px; color: var(--faint); transition: transform .15s; flex: none; font-size: 10px; }
details[open] > summary .car { transform: rotate(90deg); }
/* One leading edge per level: the caret column, then --step for everything under a session. */
#main { --step: 36px; }
.grp { margin-bottom: 20px; }
.grp > summary { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px 6px 0; }
.grp > summary .name { font-weight: 600; font-size: var(--fs-body); white-space: nowrap; color: var(--c); }
.grp > summary .doing { color: var(--mute); min-width: 12em; flex: 1 1 12em; }
.num { font: var(--fs-meta) var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.num .ad { color: var(--add); } .num .de { color: var(--del); }
.files { padding-left: var(--step); }
.file > summary { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px 5px 0; }
/* The file caret sits in the session caret's column; the path on the session name's edge. */
.file > summary .car { margin-left: calc(-1 * var(--step)); margin-right: calc(var(--step) - 20px); }
/* Only the name answers the pointer, as in the band and the pane. */
.grp > summary:hover .name, .file > summary:hover .path .base { text-decoration: underline; text-underline-offset: 3px; }
.path { font: var(--fs-ui) var(--mono); white-space: nowrap; }
.path .dir { color: var(--faint); }
.titles { color: var(--mute); font-size: var(--fs-ui); min-width: 0; flex: 1; }
.titles i { font-style: normal; color: var(--faint); padding: 0 5px; }
.open { border: 0; background: none; color: var(--faint); cursor: pointer; padding: 0 2px; }
.open:hover { color: var(--ink); }
.fresh { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--c, var(--a0)) 30%, transparent); } 100% { background: transparent; } }

/* A file's diff is one box, as GitHub draws it: each hunk under a slim header, and a row for the lines
   no hunk shows (before, between, after) that opens them in place. */
.hunks { padding: 6px 0 14px; margin-left: calc(-1 * var(--step)); }
.dbox { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.hh { display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; background: var(--code); font-size: var(--fs-ui); border-top: 1px solid var(--line); }
.dbox > .hh:first-child { border-top: 0; }
.hh .t { font-weight: 500; }
.hh .t.where { font: var(--fs-meta) var(--mono); color: var(--mute); }
.hh .ln { margin-left: auto; font: var(--fs-meta) var(--mono); color: var(--faint); }
.gap { display: flex; gap: 8px; align-items: center; padding: 3px 10px 3px 14px; font: var(--fs-meta) var(--mono); color: var(--mute); background: color-mix(in srgb, var(--a0) 7%, var(--code)); border-top: 1px solid var(--line); cursor: pointer; }
.dbox > .gap:first-child { border-top: 0; }
.gap:hover { color: var(--ink); background: color-mix(in srgb, var(--a0) 14%, var(--code)); }
.gap + .diff, .diff + .gap { border-top: 1px solid var(--line); }
.diff { font: 12px/20px var(--mono); overflow-x: auto; background: var(--panel); }
.l { display: grid; grid-template-columns: 44px 18px 1fr; white-space: pre-wrap; overflow-wrap: anywhere; }
.l .n { color: var(--faint); text-align: right; padding-right: 8px; user-select: none; font-variant-numeric: tabular-nums; }
.l:is(.add, .del) .n { background: color-mix(in srgb, var(--c, var(--nobody)) 22%, transparent); color: var(--ink); }
.l .s { color: var(--faint); text-align: center; user-select: none; }
.l.add .s { color: var(--add); font-weight: 700; } .l.del .s { color: var(--del); font-weight: 700; }
.l.add { background: color-mix(in srgb, var(--c, var(--nobody)) var(--tint), transparent); }
.l.del { background: color-mix(in srgb, var(--del) 6%, transparent); }
.l.del code { color: var(--mute); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--c, var(--nobody)) 70%, transparent); }
.l code { font: inherit; background: none; padding: 0; }
.l mark { background: color-mix(in srgb, var(--c) 30%, transparent); color: inherit; border-radius: 2px; }
.l del { color: var(--mute); }
.more { padding: 4px 10px; color: var(--mute); cursor: pointer; font-size: var(--fs-meta); background: var(--code); }
.empty { color: var(--mute); padding: 40px 0; }

/* Focused file. */
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.bar .btn { border: 1px solid var(--line); background: var(--panel); padding: 3px 10px; border-radius: 7px; cursor: pointer; }
.bar .crumb { font: var(--fs-ui) var(--mono); color: var(--mute); overflow-wrap: anywhere; }
.bar .crumb b { color: var(--ink); font-weight: 600; }
.doc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px 40px 40px; max-width: 920px; }
.markdown-body { background: transparent; font-size: 15px; }
.markdown-body .hljs, .diff .hljs { background: transparent; }
.sec > summary { display: flex; align-items: baseline; gap: 6px; margin-left: -18px; }
.sec > summary > :is(h1, h2, h3, h4, h5, h6) { flex: 1; margin-bottom: 8px; }
.sec > summary .car { align-self: center; width: 12px; }
.sec .chg-titles { font-size: var(--fs-meta); color: var(--mute); font-weight: 400; display: flex; gap: 6px; flex-wrap: wrap; align-self: center; }
.chip { font-size: var(--fs-meta); padding: 2px 8px; border-radius: 10px; background: color-mix(in srgb, var(--c) var(--tint), transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); white-space: nowrap; color: var(--ink); }
.markdown-body .chg { background: color-mix(in srgb, var(--c) calc(var(--tint) / 2), transparent); border-radius: 6px; padding: 4px 12px; margin-inline: -12px; }
.markdown-body mark { background: color-mix(in srgb, var(--c) var(--tint), transparent); color: inherit; border-bottom: 2px solid var(--c); padding: 0 1px; }
.markdown-body del { color: var(--c); opacity: .75; }
.markdown-body div.ins { background: color-mix(in srgb, var(--c) var(--tint), transparent); border-radius: 6px; padding: 4px 12px; margin-inline: -12px; }
.markdown-body div.dels { padding: 4px 12px; margin-inline: -12px; text-decoration: line-through; color: var(--mute); }
.src { padding: 0; overflow: hidden; }

/* Activity feed. */
.ev { display: grid; gap: 2px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
.ev:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.ev .t { font-size: var(--fs-ui); overflow-wrap: anywhere; }
.ev .w { font-size: var(--fs-meta); color: var(--faint); overflow-wrap: anywhere; }
.ev .w b { font-weight: 500; color: var(--c); }
.ev.off { display: none; }

/* Finder. */
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(640px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); margin-top: 12vh; }
dialog::backdrop { background: rgba(0,0,0,.25); }
dialog input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; font: var(--fs-body) var(--sans); background: transparent; color: var(--ink); outline: none; }
#hits { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
#hits li { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
#hits li.on { background: var(--hover); }
#hits .k { font-size: var(--fs-meta); color: var(--faint); width: 14px; flex: none; }
#hits .p { font: var(--fs-meta) var(--mono); color: var(--mute); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The key list behind `?`. */
#help { width: min(440px, calc(100vw - 32px)); padding: 16px 20px 18px; }
#help h2 { font-size: var(--fs-body); font-weight: 600; margin: 0 0 10px; }
#help dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
#help dt { text-align: right; } #help dd { margin: 0; color: var(--mute); }

@media (max-width: 1100px) { .app { grid-template-columns: var(--lw, 260px) 5px minmax(0, 1fr) !important; } .right, .sash.r { display: none; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr !important; }
  .sash { display: none; }
  .rail { position: static; height: auto; }
  .left { border-right: 0; border-bottom: 1px solid var(--line); }
  #tree { height: 40vh; flex: none; }
  main { padding: 12px 16px 60px; }
  .doc { padding: 16px; }
  .find { min-width: 0; }
  .find span { display: none; }
  .titles { display: none; }
  .grp > summary .mute, .grp > summary .doing { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Peers <span class="live" id="live">Offline</span></h1>
  <button class="keys" id="keysbtn" title="Keys (?)"><kbd>?</kbd> Keys</button>
  <button class="find" id="findbtn"><i class="bi bi-search"></i><span>Find a file or heading</span><kbd style="margin-left:auto">⌘K</kbd></button>
</header>
<div class="app">
  <aside class="rail left">
    <div id="legend"></div>
    <div class="treebar"><label><input type="checkbox" id="changed"> Changed files only</label></div>
    <div id="tree"></div>
  </aside>
  <div class="sash l" title="Drag to resize"></div>
  <main id="main"></main>
  <div class="sash r" title="Drag to resize"></div>
  <aside class="rail right"><div class="label">Activity</div><div id="feed"></div></aside>
</div>
<dialog id="help"><h2>Keys</h2><dl>
  <dt><kbd>⌘K</kbd> <kbd>/</kbd></dt><dd>find a file or heading</dd>
  <dt><kbd>↑ ↓</kbd> <kbd>enter</kbd></dt><dd>pick a find result</dd>
  <dt><kbd>esc</kbd></dt><dd>back to the overview, or close this</dd>
  <dt><kbd>?</kbd></dt><dd>this help</dd>
  <dt>click a name</dt><dd>fold a session or a file; the fold stays</dd>
  <dt>click <i class="bi bi-arrows-expand"></i></dt><dd>show lines the diff hides</dd>
</dl></dialog>
<dialog id="finder"><input id="q" placeholder="Find a file or heading" autocomplete="off" spellcheck="false"><ul id="hits"></ul></dialog>
<script type="module">
import { marked } from '/vendor/marked.mjs'
import { Wunderbaum } from '/vendor/wunderbaum.mjs'
import Fuse from '/vendor/fuse.mjs'
import { Idiomorph } from '/vendor/idiomorph.mjs'
import hljs from '/vendor/highlight.mjs'
import Split from '/vendor/split-grid.mjs'
import { gaps, gapText } from '/lib/rows.mjs'

// Open state: sessions (depth 2) open, files and unchanged doc sections (depth 3) shut, unless the viewer
// flipped that one block. The flips persist per viewer.
const saved = (() => { try { return JSON.parse(localStorage.getItem('peers-view') ?? '{}') } catch { return {} } })()
const S = { state: null, focus: null, mode: null, only: null, flip: new Set(saved.flip ?? []), more: new Set(), expand: new Map(), text: new Map(), full: false, live: false,
  docs: new Map(), files: new Map(), fresh: new Map(), sigs: new Map(), lines: new Map(), freshLines: new Map(), changedOnly: !!saved.changedOnly }
const save = () => { try { localStorage.setItem('peers-view', JSON.stringify({ flip: [...S.flip].slice(-500), changedOnly: S.changedOnly, cols: saved.cols })) } catch {} }
const isOpen = (id, depth) => (depth <= 2) !== S.flip.has(id)

const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
const ago = t => { const s = Math.max(1, Math.round((Date.now() - t) / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d` }
const isDoc = rel => /\.(md|mdx|markdown)$/i.test(rel)
const num = (a, d) => `<span class="num">${a ? `<span class="ad">+${a}</span>` : ''}${a && d ? ' ' : ''}${d ? `<span class="de">−${d}</span>` : ''}</span>`
const pathHtml = (rel, kind = '') => { const i = rel.lastIndexOf('/', rel.length - 2); return `<span class="path k-${kind}">${i < 0 ? '' : `<span class="dir">${esc(rel.slice(0, i + 1))}</span>`}<span class="base">${esc(rel.slice(i + 1))}</span></span>` }
const KD = { add: 'A', edit: 'M', delete: 'D' }
const KN = { add: 'Added', edit: 'Edited', delete: 'Deleted' }
const kd = k => (k ? `<span class="kd k-${k}" title="${KN[k]}">${KD[k]}</span>` : '')
const names = as => as.map(a => `<b style="color:${c(a)}">${esc(nameOf(a))}</b>`).join(' ')

// File and folder icons: the VS Code Material Icon Theme's own manifest, by its lookup order.
// Names, then the longest extension, then the language VS Code gives the extension.
const MI = await fetch('/vendor/material-icons.json').then(r => r.json()).catch(() => null)
const LANGID = { ts: 'typescript', mts: 'typescript', cts: 'typescript', tsx: 'typescriptreact', js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascriptreact', json: 'json', md: 'markdown', css: 'css', html: 'html', py: 'python', sh: 'shellscript', zsh: 'shellscript', yml: 'yaml', yaml: 'yaml', sql: 'sql', go: 'go', rs: 'rust', toml: 'toml', xml: 'xml', svg: 'xml' }
const iconOf = (name, dir = false, open = false) => {
  if (!MI) return ''
  const n = name.toLowerCase()
  let id
  if (dir) id = (open ? MI.folderNamesExpanded : MI.folderNames)[n] ?? (open ? MI.folderExpanded : MI.folder)
  else {
    id = MI.fileNames[n]
    const parts = n.split('.')
    for (let j = 1; !id && j < parts.length; j++) id = MI.fileExtensions[parts.slice(j).join('.')]
    id ??= MI.languageIds[LANGID[parts.at(-1)]] ?? MI.file
  }
  const f = MI.iconDefinitions[id]
  return f ? `/vendor/material-icons/${f}` : ''
}
const iconImg = (name, dir) => { const u = iconOf(name, dir); return u ? `<img class="fi" src="${u}" alt="">` : '' }

// One color per session, by start order over every repo: the /peers-view pane uses the same rule.
let order = []
const sessions = () => {
  const m = new Map()
  const named = new Map()
  for (const r of S.state.repos) for (const s of r.sessions) {
    if (!m.has(s.id) || m.get(s.id).updated < s.updated) m.set(s.id, s)
    if (s.title) named.set(s.id, s)
  }
  // A session claims its task in one repo: that name holds in every repo.
  return [...m.values()].map(s => (named.has(s.id) ? { ...s, name: named.get(s.id).name, title: named.get(s.id).title } : s))
}
// Rank by a session's earliest start over its repos: the pane uses the same rule.
const rank = () => {
  const m = new Map()
  for (const r of S.state.repos) for (const s of r.sessions) m.set(s.id, Math.min(m.get(s.id) ?? Infinity, s.started ?? 0))
  return [...m.keys()].sort((a, b) => m.get(a) - m.get(b))
}
const c = id => { const i = order.indexOf(id); return i < 0 ? 'var(--nobody)' : `var(--a${i % 8})` }
const nameOf = id => sessions().find(s => s.id === id)?.name ?? 'nobody'
const writing = s => Date.now() - s.updated < 20000

// Syntax color per line; a language hljs does not know stays plain.
const LANG = { mjs: 'javascript', cjs: 'javascript', jsx: 'javascript', tsx: 'typescript', mts: 'typescript', yml: 'yaml', sh: 'bash', zsh: 'bash', md: 'markdown' }
const langOf = rel => { const e = rel.split('.').pop().toLowerCase(); const l = LANG[e] ?? e; return hljs.getLanguage(l) ? l : null }
const hl = (s, lang) => { if (!lang || !s) return esc(s); try { return hljs.highlight(s, { language: lang, ignoreIllegals: true }).value } catch { return esc(s) } }

// First changed line of a hunk, in the new file.
const firstLine = h => { let n = h.new; for (const x of h.lines) { if (x.t !== ' ') break; n++ } return n }

function legend() {
  const ss = sessions().sort((a, b) => b.updated - a.updated)
  const files = id => S.state.repos.reduce((n, r) => n + r.files.filter(f => f.authors.includes(id)).length, 0)
  morph(document.getElementById('legend'), `<div class="label">Sessions</div>` + (ss.map(s => `
    <div class="who ${S.only === s.id ? 'on' : S.only ? 'off' : ''}" data-only="${s.id}" style="--c:${c(s.id)}" title="Click to show only ${esc(s.name)}">
      <span><b>${esc(s.name)}</b>${s.title ? ` <span class="mute">${esc(s.title)}</span>` : ''}</span>
      <span class="meta ${writing(s) ? 'now' : ''}">${files(s.id)} · ${writing(s) ? 'now' : ago(s.updated)}</span>
      ${s.doing ? `<span class="doing">${esc(s.doing)}</span>` : ''}
    </div>`).join('') || '<div class="faint" style="padding:6px 8px">No live sessions.</div>'))
}

function diffLines(f, h, cap, root) {
  const fresh = S.freshLines.get(`${root}\0${f.rel}`)
  const lang = langOf(f.rel)
  let out = ''
  let o = h.old
  let n = h.new
  let i = 0
  for (const x of h.lines) {
    if (cap && i++ >= cap) break
    const dim = S.only && x.t !== ' ' && x.a !== S.only
    const cls = x.t === '+' ? 'add' : x.t === '-' ? 'del' : ''
    const col = x.t === ' ' ? '' : `--c:${dim ? 'var(--nobody)' : c(x.a)}`
    const ln = x.t === '-' ? o++ : x.t === '+' ? n++ : (o++, n++)
    out += `<div class="l ${cls} ${fresh?.has(x.t + x.s) ? 'fresh' : ''}" style="${col}" title="${x.t === ' ' ? '' : esc(nameOf(x.a))}"><span class="n">${ln}</span><span class="s">${x.t === ' ' ? '' : x.t}</span><code>${hl(x.s, lang) || ' '}</code></div>`
  }
  return out
}

function hunkHtml(r, f, h) {
  const id = `h:${r.root}:${f.rel}:${h.new}`
  const cap = S.more.has(id) ? 0 : 60
  return `<div class="hh"><span class="t ${h.said ? '' : 'where'}">${esc(h.t || (f.kind === 'add' ? 'new file' : f.kind === 'delete' ? 'deleted file' : 'change'))}</span><span class="ln">L${firstLine(h)}</span></div>
    <div class="diff">${diffLines(f, h, cap, r.root)}</div>${cap && h.lines.length > cap ? `<div class="more" data-more="${esc(id)}">${h.lines.length - cap} more lines</div>` : ''}`
}

// Lines no hunk shows (lib/rows.mjs gaps): a row that opens 120 more of them from the file per click.
const STEP = 120
function gapHtml(r, f, g) {
  const id = `g:${r.root}/${f.rel}:${g.from}`
  const t = S.text.get(`${r.root}\0${f.rel}`)
  const n = t?.v === f.mtime ? (S.expand.get(id) ?? 0) : 0
  const to = Math.min(g.to, g.from + n - 1)
  const lang = langOf(f.rel)
  let out = ''
  if (n) {
    out += '<div class="diff">'
    for (let i = g.from; i <= to; i++) out += `<div class="l"><span class="n">${i}</span><span class="s"></span><code>${hl(t.lines[i - 1] ?? '', lang) || ' '}</code></div>`
    out += '</div>'
  }
  if (to < g.to) out += `<div class="gap" data-gap="${esc(id)}" data-groot="${esc(r.root)}" data-grel="${esc(f.rel)}" title="Show ${Math.min(STEP, g.to - to)} more"><i class="bi bi-arrows-expand"></i>${esc(gapText({ from: to + 1, to: g.to }))}</div>`
  return out
}

// A file's hunks in one box, with a gap row wherever lines are not shown.
function diffBox(r, f, hunks) {
  const at = new Map(gaps(hunks, f.size ?? 0).map(g => [g.before, g]))
  let out = ''
  hunks.forEach((h, i) => { if (at.has(i)) out += gapHtml(r, f, at.get(i)); out += hunkHtml(r, f, h) })
  if (at.has(hunks.length)) out += gapHtml(r, f, at.get(hunks.length))
  return `<div class="dbox">${out}</div>`
}

async function expand(id, root, rel) {
  const f = S.state.repos.find(x => x.root === root)?.files.find(x => x.rel === rel)
  const k = `${root}\0${rel}`
  if (S.text.get(k)?.v !== f?.mtime) {
    const d = await loadDoc(root, rel)
    S.text.set(k, { v: f?.mtime, lines: (d?.text ?? '').split('\n') })
    for (const x of S.expand.keys()) if (x.startsWith(`g:${root}/${rel}:`)) S.expand.delete(x)
  }
  S.expand.set(id, (S.expand.get(id) ?? 0) + STEP)
  render()
}

function fileRow(r, f, group, hunks) {
  const id = `f:${group}:${r.root}:${f.rel}`
  const adds = hunks.reduce((n, h) => n + h.lines.filter(x => x.t === '+').length, 0)
  const dels = hunks.reduce((n, h) => n + h.lines.filter(x => x.t === '-').length, 0)
  const said = [...new Set(hunks.filter(h => h.said).map(h => h.t))]
  const fresh = S.fresh.has(`${r.root}\0${f.rel}`) ? 'fresh' : ''
  return `<details class="file" data-id="${esc(id)}" data-depth="3" ${isOpen(id, 3) ? 'open' : ''}>
    <summary class="${fresh}"><i class="car bi bi-chevron-right"></i>${f.count ? iconImg(f.rel.split('/').at(-2), true) : iconImg(f.rel.split('/').pop())}${kd(f.kind)}${pathHtml(f.rel, f.kind)}${f.count ? `<span class="mute">${f.count} new files</span>` : ''}
      <span class="titles">${said.map(esc).join('<i>·</i>')}</span>${num(adds, dels)}<span class="faint num">${ago(f.mtime)}</span>
      ${f.count ? '' : `<button class="open" data-root="${esc(r.root)}" data-rel="${esc(f.rel)}" title="Open the file"><i class="bi bi-box-arrow-up-right"></i></button>`}</summary>
    <div class="hunks">${hunks.length ? diffBox(r, f, hunks) : `<div class="more">${f.count ? 'A new folder: open its files in the tree.' : 'No text diff (binary, empty or mode only).'}</div>`}</div></details>`
}

// Each hunk sits under the session owning most of its lines; a file shows under each such session.
function overview() {
  const st = S.state
  let out = ''
  for (const r of st.repos) {
    const groups = new Map(r.sessions.slice().sort((a, b) => b.updated - a.updated).map(s => [s.id, []]))
    groups.set(null, [])
    for (const f of r.files) {
      const by = new Map()
      for (const h of f.hunks) {
        const a = groups.has(h.a) ? h.a : null
        if (!by.has(a)) by.set(a, [])
        by.get(a).push(h)
      }
      if (!f.hunks.length) for (const a of f.authors.length ? f.authors : [null]) by.set(groups.has(a) ? a : null, [])
      for (const [a, hs] of by) groups.get(a).push([f, hs])
    }
    let body = ''
    for (const [a, rows] of groups) {
      if (S.only && a !== S.only) continue
      const s = r.sessions.find(x => x.id === a)
      if (!rows.length) continue
      const id = `s:${r.root}:${a}`
      const adds = rows.reduce((n, [, hs]) => n + hs.reduce((m, h) => m + h.lines.filter(x => x.t === '+').length, 0), 0)
      const dels = rows.reduce((n, [, hs]) => n + hs.reduce((m, h) => m + h.lines.filter(x => x.t === '-').length, 0), 0)
      body += `<details class="grp" data-id="${esc(id)}" data-depth="2" style="--c:${c(a)}" ${isOpen(id, 2) ? 'open' : ''}>
        <summary><i class="car bi bi-chevron-right"></i><span class="name">${esc(s ? nameOf(a) : 'Unattributed')}</span>
          ${s?.title ? `<span class="mute">${esc(s.title)}</span>` : ''}
          <span class="doing">${s?.doing ? esc(s.doing) : ''}</span>
          <span class="faint num">${rows.length} file${rows.length === 1 ? '' : 's'}</span>${num(adds, dels)}${s ? `<span class="faint num">${ago(s.updated)}</span>` : ''}</summary>
        ${rows.length ? `<div class="files">${rows.map(([f, hs]) => fileRow(r, f, a, hs)).join('')}</div>` : ''}</details>`
    }
    if (body) out += `<div class="repo">${esc(r.name)}/</div>${body}`
  }
  return out || '<div class="empty">No live sessions.</div>'
}

// A document: the server's lines (lib/doc.mjs) as Markdown, added text marked and removed text struck
// in the author's color, folded by heading. In a doc with a change, unchanged sections start shut;
// a jump from the finder opens all.
function mdOf(ls) {
  const out = []
  for (let i = 0; i < ls.length; i++) {
    const x = ls[i]
    if (x.fence) { if (x.k !== '-') out.push(x.s); continue }
    if (x.k === '=') { out.push(x.s); continue }
    if (x.g) {
      let j = i
      while (j + 1 < ls.length && ls[j + 1].g === x.g) j++
      const group = ls.slice(i, j + 1)
      out.push('', `<div class="${x.k === '+' ? 'ins' : 'dels'}" style="--c:${c(group.find(y => y.a)?.a)}">`, '', ...group.map(y => (x.k === '+' ? y.s : esc(y.s))), '', '</div>', '')
      i = j
      continue
    }
    const col = c(x.a)
    const tag = (t, v) => (t === '+' ? `<mark style="--c:${col}">${esc(v)}</mark>` : t === '-' ? `<del style="--c:${col}">${esc(v)}</del>` : esc(v))
    if (x.k === '~') out.push(x.pre + x.runs.map(r => tag(r.t, r.s)).join(''))
    else out.push(x.pre + tag(x.k, x.s.slice(x.pre.length)))
  }
  return out.join('\n')
}

// Blocks holding an inline change get the author's bar; code blocks get syntax color.
function blocks(html) {
  const t = document.createElement('template')
  t.innerHTML = html
  for (const m of t.content.querySelectorAll('mark, del')) {
    const b = m.closest('p, li, td, th, blockquote, h1, h2, h3, h4, h5, h6') ?? m.parentElement
    if (b && !b.classList.contains('chg')) { b.classList.add('chg'); b.style.setProperty('--c', m.style.getPropertyValue('--c')) }
  }
  for (const el of t.content.querySelectorAll('pre code')) try { hljs.highlightElement(el) } catch {}
  return t.innerHTML
}

function docView(r, f, d) {
  const key = `${r.root}\0${f?.rel ?? S.focus.rel}`
  if (d.html && d.full === S.full && d.flips === S.flip.size && d.only === S.only) return d.html
  const ls = d.lines
  const hunks = f?.hunks ?? []
  // New-file line of each doc line ('-' lines have none), to place each change's title in its section.
  let n = 0
  const at = ls.map(x => (x.k === '-' ? n : ++n))
  const any = !S.full && ls.some(x => x.k !== '=')
  const secs = [{ depth: 0, start: 0, head: -1, kids: [] }]
  const stack = [secs[0]]
  ls.forEach((x, i) => {
    const m = !x.fence && x.k !== '-' && /^(#{1,6})\s/.exec(x.s)
    if (!m) return
    const depth = m[1].length
    while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop()
    const sec = { depth, start: i, head: i, kids: [] }
    stack[stack.length - 1].kids.push(sec)
    stack.push(sec)
    secs.push(sec)
  })
  secs.sort((a, b) => a.start - b.start)
  secs.forEach((s, i) => { s.end = i + 1 < secs.length ? secs[i + 1].start : ls.length })
  const render = s => {
    const own = ls.slice(s.head + 1, s.end)
    const lo = at[s.start]
    const hi = s.end < ls.length ? at[s.end] : Infinity
    const mine = hunks.filter(h => h.said && firstLine(h) >= lo && firstLine(h) < hi)
    const changed = ls.slice(s.start, s.kids.length ? s.kids[s.kids.length - 1].end : s.end).some(x => x.k !== '=')
    const inner = blocks(marked.parse(mdOf(own))) + s.kids.map(render).join('')
    if (s.head < 0) return inner
    const id = `d:${key}:${s.start}`
    const headHtml = blocks(marked.parse(mdOf([ls[s.head]])))
    const chips = [...new Map(mine.map(h => [h.t, h])).values()].map(h => `<span class="chip" style="--c:${c(h.a)}">${esc(h.t)}</span>`).join('')
    return `<details class="sec" data-id="${esc(id)}" data-depth="${changed || !any ? 2 : 3}" data-line="${at[s.start]}" ${isOpen(id, changed || !any ? 2 : 3) ? 'open' : ''}>
      <summary><i class="car bi bi-chevron-right"></i>${headHtml}${chips ? `<span class="chg-titles">${chips}</span>` : ''}</summary><div class="sec-body">${inner}</div></details>`
  }
  d.html = `<article class="doc markdown-body">${render(secs[0])}</article>`
  Object.assign(d, { full: S.full, flips: S.flip.size, only: S.only })
  return d.html
}

// Code as a whole file: each changed line in its author's color, word changes marked.
function srcView(f, d) {
  const lang = langOf(S.focus.rel)
  let n = 0
  const rows = d.lines.map(x => {
    const ln = x.k === '-' ? '' : ++n
    const col = x.k === '=' ? '' : `--c:${c(x.a)}`
    const cls = x.k === '+' || x.k === '~' ? 'add' : x.k === '-' ? 'del' : ''
    const body = x.k === '~' ? esc(x.pre) + x.runs.map(r => (r.t === '+' ? `<mark>${esc(r.s)}</mark>` : r.t === '-' ? `<del>${esc(r.s)}</del>` : esc(r.s))).join('') : hl(x.s, lang)
    return `<div class="l ${cls}" style="${col}"><span class="n">${ln}</span><span class="s">${x.k === '=' ? '' : x.k === '~' ? '±' : x.k}</span><code>${body || ' '}</code></div>`
  })
  return `<div class="doc src"><div class="diff">${rows.join('')}</div></div>`
}

async function loadDoc(root, rel) {
  const r = await fetch(`/api/doc?root=${encodeURIComponent(root)}&rel=${encodeURIComponent(rel)}`)
  return r.ok ? r.json() : null
}

function focusView() {
  const r = S.state.repos.find(x => x.root === S.focus.root)
  const f = r?.files.find(x => x.rel === S.focus.rel)
  const mode = S.mode ?? (f && !isDoc(S.focus.rel) ? 'diff' : 'doc')
  const rel = S.focus.rel
  let out = `<div class="bar"><button class="btn" data-back><i class="bi bi-arrow-left"></i> Overview</button>
    <span class="seg"><button data-mode="doc" class="${mode === 'doc' ? 'on' : ''}">${isDoc(rel) ? 'Document' : 'Source'}</button><button data-mode="diff" class="${mode === 'diff' ? 'on' : ''}" ${f ? '' : 'disabled'}>Changes</button></span>
    ${f ? kd(f.kind) : ''}<span class="crumb">${esc(r?.name ?? '')}/${esc(rel.split('/').slice(0, -1).join('/'))}${rel.includes('/') ? '/' : ''}<b>${esc(rel.split('/').pop())}</b></span>
    ${f ? `<span class="who-names">${names(f.authors)}</span>${num(f.hunks.reduce((n, h) => n + h.lines.filter(x => x.t === '+').length, 0), f.hunks.reduce((n, h) => n + h.lines.filter(x => x.t === '-').length, 0))}` : '<span class="faint">no uncommitted change</span>'}</div>`
  if (mode === 'diff' && f) return out + (f.hunks.length ? diffBox(r, f, f.hunks) : '<div class="empty">No text diff.</div>')
  // The repo's last session ended while the file was open.
  if (!r) return out + '<div class="empty">This repo has no live session now.</div>'
  const d = S.docs.get(`${S.focus.root}\0${rel}`)
  if (!d) return out + '<div class="empty">Loading…</div>'
  if (d.missing) return out + '<div class="empty">This file is not in a shown repo now.</div>'
  return out + (isDoc(rel) ? docView(r, f, d) : srcView(f, d))
}

function feed() {
  const rows = S.state.repos.flatMap(r => r.feed.map(e => ({ ...e, root: r.root, repo: r.name }))).sort((a, b) => b.at - a.at).slice(0, 80)
  morph(document.getElementById('feed'), rows.map(e => `
    <div class="ev ${S.only && e.a !== S.only ? 'off' : ''} ${Date.now() - e.at < 15000 ? 'fresh' : ''}" style="--c:${c(e.a)}" data-root="${esc(e.root)}" data-rel="${esc(e.rels[0] ?? '')}">
      <span class="t ${e.t ? '' : 'mute'}">${e.kind === 'commit' ? `<i class="bi bi-check2-circle faint"></i> <span class="mono faint">${esc(e.sha)}</span> ${esc(e.t)}` : esc(e.t || 'Edited')}</span>
      <span class="w"><b>${esc(nameOf(e.a))}</b> · ${ago(e.at)} · ${e.rels.slice(0, 3).map(x => esc(x.split('/').pop())).join(', ')}${e.rels.length > 3 ? ` +${e.rels.length - 3}` : ''}</span>
    </div>`).join('') || '<div class="faint">No activity yet.</div>')
}

const liveMark = () => { const el = document.getElementById('live'); el.className = `live ${S.live ? 'on' : ''}`; el.textContent = S.live ? 'Live' : 'Offline' }
const morph = (el, html) => Idiomorph.morph(el, html, { morphStyle: 'innerHTML' })

async function render() {
  if (!S.state) return
  order = rank()
  if (S.focus) {
    const k = `${S.focus.root}\0${S.focus.rel}`
    const f = S.state.repos.find(x => x.root === S.focus.root)?.files.find(x => x.rel === S.focus.rel)
    const v = f ? f.mtime : 0
    if (!S.docs.has(k) || S.docs.get(k).v !== v) S.docs.set(k, { ...((await loadDoc(S.focus.root, S.focus.rel)) ?? { missing: true }), v })
  }
  liveMark()
  legend()
  feed()
  morph(document.getElementById('main'), S.focus ? focusView() : overview())
  tree.paint()
  if (S.jump) { const el = [...document.querySelectorAll('.sec[data-line]')].filter(x => +x.dataset.line <= S.jump).pop(); S.jump = 0; el?.scrollIntoView({ block: 'start' }) }
}

// Files whose diff changed since the last push pulse once, in place.
function mark(st) {
  const now = Date.now()
  for (const r of st.repos) for (const f of r.files) {
    const k = `${r.root}\0${f.rel}`
    const sig = `${f.mtime}:${f.hunks.length}:${f.hunks.reduce((n, h) => n + h.lines.length, 0)}`
    // The changed lines new since the last push pulse too.
    const ls = new Set(f.hunks.flatMap(h => h.lines.filter(x => x.t !== ' ').map(x => x.t + x.s)))
    if (S.sigs.has(k) && S.sigs.get(k) !== sig) {
      S.fresh.set(k, now)
      const was = S.lines.get(k) ?? new Set()
      S.freshLines.set(k, new Set([...ls].filter(x => !was.has(x))))
    }
    S.sigs.set(k, sig)
    S.lines.set(k, ls)
  }
  for (const k of S.freshLines.keys()) if (!S.fresh.has(k)) S.freshLines.delete(k)
  for (const [k, t] of S.fresh) if (now - t > 2500) S.fresh.delete(k)
  if (S.fresh.size) setTimeout(() => { for (const [k, t] of S.fresh) if (Date.now() - t > 2500) { S.fresh.delete(k); S.freshLines.delete(k) } render() }, 2600)
}

// The tree: every file git lists, per shown repo; a folder rolls up its files' authors and counts.
const tree = {
  wb: null,
  roots: '',
  changed: new Map(),
  async load() {
    const roots = S.state.repos.map(r => r.root)
    const news = S.state.repos.flatMap(r => r.files.filter(f => f.isNew).map(f => r.root + f.rel)).join('|')
    if (this.wb && this.roots === roots.join('|') + news) return
    this.roots = roots.join('|') + news
    const lists = await Promise.all(S.state.repos.map(r => fetch(`/api/files?root=${encodeURIComponent(r.root)}`).then(x => (x.ok ? x.json() : { paths: [], heads: [] }))))
    finder.set(S.state.repos.map((r, i) => ({ r, ...lists[i] })))
    const source = S.state.repos.map((r, i) => {
      const top = { title: `${r.name}/`, key: `${r.root}\0`, children: [], expanded: true, classes: 'repo' }
      const dirs = new Map([['', top]])
      for (const p of lists[i].paths.slice().sort()) {
        const parts = p.split('/')
        for (let j = 1; j < parts.length; j++) {
          const d = parts.slice(0, j).join('/')
          if (!dirs.has(d)) { const n = { title: parts[j - 1], key: `${r.root}\0${d}/`, children: [] }; dirs.get(parts.slice(0, j - 1).join('/')).children.push(n); dirs.set(d, n) }
        }
        dirs.get(parts.slice(0, -1).join('/')).children.push({ title: parts[parts.length - 1], key: `${r.root}\0${p}` })
      }
      // Folders first, then files, each by name.
      const sort = n => { n.children?.sort((a, b) => (!!b.children - !!a.children) || a.title.localeCompare(b.title)); n.children?.forEach(sort) }
      sort(top)
      return top
    })
    if (!this.wb) {
      this.wb = new Wunderbaum({
        element: document.getElementById('tree'),
        source,
        iconMap: 'bootstrap',
        icon: e => { if (e.node.key.endsWith('\0')) return undefined; const dir = e.node.key.endsWith('/'); return iconOf(e.node.title, dir, dir && e.node.expanded) || undefined },
        quicksearch: true,
        filter: { mode: 'hide', autoExpand: true },
        activate: e => { if (!/[/\0]$/.test(e.node.key)) { const [root, rel] = e.node.key.split('\0'); open(root, rel) } },
        render: e => this.deco(e),
        init: () => this.paint(true),
      })
      return
    }
    // A new file reloads the tree: keep what the viewer had expanded.
    const exp = []
    this.wb.visit(n => { if (n.expanded) exp.push(n.key) })
    await this.wb.load(source)
    for (const k of exp) this.wb.findKey(k)?.setExpanded(true, { noAnimation: true })
    this.paint()
  },
  deco(e) {
    const info = this.changed.get(e.node.key)
    let tn = e.nodeElem.querySelector('.tn')
    e.nodeElem.parentElement?.classList.toggle('changed', !!info)
    e.nodeElem.parentElement?.classList.toggle('fresh', !!info?.fresh)
    for (const k of Object.keys(KD)) e.nodeElem.parentElement?.classList.toggle(`k-${k}`, info?.kind === k)
    if (!info) { tn?.remove(); return }
    if (!tn) { tn = document.createElement('span'); tn.className = 'tn'; e.nodeElem.append(tn) }
    tn.innerHTML = `${info.adds ? `<span class="ad">+${info.adds}</span>` : ''}${info.dels ? `<span class="de">−${info.dels}</span>` : ''}${info.kind && !e.node.key.endsWith('/') ? kd(info.kind) : ''}`
  },
  // Roll each changed file up to its folders, then redraw and expand the path to each change.
  paint(first = false) {
    if (!this.wb) return
    const m = new Map()
    for (const r of S.state.repos) for (const f of r.files) {
      if (S.only && !f.authors.includes(S.only)) continue
      const adds = f.hunks.reduce((n, h) => n + h.lines.filter(x => x.t === '+').length, 0)
      const dels = f.hunks.reduce((n, h) => n + h.lines.filter(x => x.t === '-').length, 0)
      const parts = f.rel.split('/')
      const keys = [`${r.root}\0${f.rel}`, `${r.root}\0`, ...parts.slice(0, -1).map((_, j) => `${r.root}\0${parts.slice(0, j + 1).join('/')}/`)]
      for (const k of keys) {
        const v = m.get(k) ?? { authors: new Set(), adds: 0, dels: 0, fresh: false }
        for (const a of f.authors.length ? f.authors : [null]) v.authors.add(a)
        v.adds += adds
        v.dels += dels
        v.fresh ||= S.fresh.has(`${r.root}\0${f.rel}`)
        if (k === keys[0]) v.kind = f.kind
        m.set(k, v)
      }
    }
    this.changed = m
    if (first) for (const k of m.keys()) if (k.endsWith('/')) this.wb.findKey(k)?.setExpanded(true)
    if (S.changedOnly) this.wb.filterNodes(n => m.has(n.key) && !n.key.endsWith('/'), { mode: 'hide' })
    else this.wb.clearFilter()
    const fk = S.focus && `${S.focus.root}\0${S.focus.rel}`
    if (fk && this.wb.getActiveNode()?.key !== fk) this.wb.findKey(fk)?.setActive(true, { noEvents: true })
    this.wb.update('any')
  },
}

// The finder: fuse.js over every path and every Markdown heading.
const finder = {
  fuse: null,
  hits: [],
  pick: 0,
  set(lists) {
    const items = []
    for (const { r, paths, heads } of lists) {
      for (const p of paths) items.push({ root: r.root, repo: r.name, rel: p, h: '', line: 0 })
      for (const x of heads) items.push({ root: r.root, repo: r.name, rel: x.rel, h: x.h, line: x.line })
    }
    this.fuse = new Fuse(items, { keys: [{ name: 'rel', weight: 1 }, { name: 'h', weight: 1.5 }], threshold: 0.35, ignoreLocation: true })
  },
  show() { const d = document.getElementById('finder'); if (!d.open) d.showModal(); const q = document.getElementById('q'); q.select(); this.run(q.value) },
  run(q) {
    this.hits = q && this.fuse ? this.fuse.search(q, { limit: 40 }).map(x => x.item) : []
    this.pick = 0
    this.draw()
  },
  draw() {
    document.getElementById('hits').innerHTML = this.hits.map((x, i) => `<li class="${i === this.pick ? 'on' : ''}" data-hit="${i}">
      <span class="k">${x.h ? '#' : iconImg(x.rel.split('/').pop())}</span><span>${esc(x.h || x.rel.split('/').pop())}</span><span class="p">${esc(x.repo)}/${esc(x.rel)}${x.line ? `:${x.line}` : ''}</span></li>`).join('')
    document.querySelector('#hits li.on')?.scrollIntoView({ block: 'nearest' })
  },
  go(i) {
    const x = this.hits[i]
    if (!x) return
    document.getElementById('finder').close()
    open(x.root, x.rel, x.line)
  },
}

function open(root, rel, line = 0) {
  S.focus = { root, rel }
  S.mode = null
  S.jump = line
  // A jump target folded away opens.
  if (line) for (const k of [...S.flip]) if (k.startsWith(`d:${root}\0${rel}:`)) S.flip.delete(k)
  S.full = !!line
  if (!line) scrollTo(0, 0)
  render()
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-rel],[data-only],[data-back],[data-mode],[data-more],[data-gap],[data-hit],#findbtn,#keysbtn')
  if (!t) return
  if (t.id === 'findbtn') return finder.show()
  if (t.dataset.hit) return finder.go(+t.dataset.hit)
  if (t.id === 'keysbtn') return help.showModal()
  if (t.dataset.gap) return expand(t.dataset.gap, t.dataset.groot, t.dataset.grel)
  if (t.dataset.rel !== undefined && t.closest('summary')) e.preventDefault()
  if (t.dataset.only) S.only = S.only === t.dataset.only ? null : t.dataset.only
  else if (t.dataset.back !== undefined) { S.focus = null; S.mode = null }
  else if (t.dataset.mode) S.mode = t.dataset.mode
  else if (t.dataset.more) S.more.add(t.dataset.more)
  else if (t.dataset.rel) return open(t.dataset.root, t.dataset.rel)
  for (const d of S.docs.values()) d.html = null
  render()
})

// A viewer's toggle flips that one block away from its default; the flip persists.
document.addEventListener('toggle', e => {
  const el = e.target
  if (!(el instanceof HTMLDetailsElement) || !el.dataset.id) return
  const id = el.dataset.id
  if (el.open === isOpen(id, +el.dataset.depth)) return
  S.flip.has(id) ? S.flip.delete(id) : S.flip.add(id)
  save()
}, true)

document.addEventListener('keydown', e => {
  const d = document.getElementById('finder')
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); return finder.show() }
  if (d.open) {
    if (e.key === 'ArrowDown') { e.preventDefault(); finder.pick = Math.min(finder.pick + 1, finder.hits.length - 1); finder.draw() }
    else if (e.key === 'ArrowUp') { e.preventDefault(); finder.pick = Math.max(finder.pick - 1, 0); finder.draw() }
    else if (e.key === 'Enter') { e.preventDefault(); finder.go(finder.pick) }
    return
  }
  if (e.target.closest('input, textarea, .wunderbaum') || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === '?') help.open ? help.close() : help.showModal()
  else if (e.key === 'Escape' && S.focus) { S.focus = null; render() }
  else if (e.key === '/') { e.preventDefault(); finder.show() }
})
const help = document.getElementById('help')
help.addEventListener('click', e => { if (e.target === help) help.close() })
document.getElementById('q').addEventListener('input', e => finder.run(e.target.value))
const box = document.getElementById('changed')
box.checked = S.changedOnly
box.addEventListener('change', () => { S.changedOnly = box.checked; save(); tree.paint() })

const app = document.querySelector('.app')
const cols = saved.cols
if (cols) { app.style.setProperty('--lw', cols[0]); app.style.gridTemplateColumns = `${cols[0]} 5px minmax(0, 1fr) 5px ${cols[1]}` }
Split({
  columnGutters: [{ track: 1, element: document.querySelector('.sash.l') }, { track: 3, element: document.querySelector('.sash.r') }],
  columnMinSizes: { 0: 180, 2: 360, 4: 200 },
  onDragEnd: () => {
    const t = getComputedStyle(app).gridTemplateColumns.split(' ')
    app.style.setProperty('--lw', t[0])
    saved.cols = [t[0], t.at(-1)]
    save()
  },
})

const es = new EventSource(`/events${location.search}`)
es.onopen = () => { S.live = true; if (S.state) render() }
es.onerror = () => { S.live = false; liveMark() }
es.onmessage = async m => {
  const st = JSON.parse(m.data)
  mark(st)
  S.state = st
  for (const d of S.docs.values()) d.html = null
  await tree.load()
  render()
}
setInterval(() => S.state && (legend(), feed()), 10000)
</script>
</body>
