<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peers live</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1d1d1f; --mute: #6e6e73; --line: #e6e3de; --code: #f4f2ee;
  --a0: #2f6fdf; --a1: #d9480f; --a2: #2b8a3e; --a3: #ae3ec9; --a4: #c2255c; --a5: #1098ad; --a6: #e67700; --a7: #5f3dc4;
  --nobody: #8e8e93; --tint: 14%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416; --panel: #1c1c1f; --ink: #ececf0; --mute: #9a9aa2; --line: #2c2c31; --code: #232327;
    --a0: #6ea2ff; --a1: #ff8a50; --a2: #5fd27a; --a3: #d68bf0; --a4: #ff6b9d; --a5: #4fd1e6; --a6: #ffb340; --a7: #a48bff;
    --tint: 22%; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
a { color: inherit; }
.app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
aside { border-right: 1px solid var(--line); padding: 16px; position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--panel); }
main { padding: 20px 28px 80px; min-width: 0; }
aside h1 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--a2); }
.pulse.off { background: var(--nobody); }
.repo { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); margin: 18px 0 6px; }
.sess { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.sess:hover, .sess.on { background: var(--code); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; margin-top: 5px; }
.dot.now { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.sname { font-weight: 600; }
.sub { color: var(--mute); font-size: 12px; }
.flist { margin: 4px 0 0; padding: 0; list-style: none; }
.flist li { display: flex; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; overflow-wrap: anywhere; }
.flist li:hover, .flist li.on { background: var(--code); }
.dots { display: flex; gap: 3px; flex: none; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.bar button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.bar button.on { border-color: var(--ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
.card > header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.card > header .path { font-weight: 600; overflow-wrap: anywhere; }
.chip { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; background: color-mix(in srgb, var(--c) var(--tint), transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.diff { font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; overflow-x: auto; }
.hunk-at { color: var(--mute); background: var(--code); padding: 2px 12px; }
.ln { display: grid; grid-template-columns: 4px 22px 1fr; white-space: pre-wrap; overflow-wrap: anywhere; }
.ln .g { background: var(--c, transparent); }
.ln .s { color: var(--mute); text-align: center; user-select: none; }
.ln.add { background: color-mix(in srgb, var(--c, var(--nobody)) var(--tint), transparent); }
.ln.del { color: var(--mute); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--c, var(--nobody)) 70%, transparent); }
.more { padding: 6px 12px; color: var(--mute); cursor: pointer; }
.doc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 32px 48px; max-width: 860px; }
.doc pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.doc code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 90%; }
.doc table { border-collapse: collapse; } .doc td, .doc th { border: 1px solid var(--line); padding: 4px 8px; }
.doc mark { background: color-mix(in srgb, var(--c) var(--tint), transparent); color: inherit; border-bottom: 2px solid var(--c); padding: 0 1px; }
.doc del { color: var(--c); opacity: .75; }
.doc div.ins { border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) calc(var(--tint) / 2), transparent); padding: 0 12px; margin: 0 -15px; }
.doc div.dels { border-left: 3px solid var(--c); padding: 0 12px; margin: 0 -15px; text-decoration: line-through; color: var(--mute); }
.empty { color: var(--mute); padding: 40px 0; }
.legend { color: var(--mute); font-size: 12px; margin: 0 0 12px; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 16px; }
  .doc { padding: 20px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<script>
const S = { state: null, focus: null, mode: null, only: null, docs: new Map(), open: new Set(), live: false }
const color = new Map()
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
const ago = t => { const s = Math.max(1, Math.round((Date.now() - t) / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.round(s / 3600)}h` }
const key = line => { const t = line.trimEnd(); return t.trim().length >= 4 && /[A-Za-z0-9]/.test(t) ? t.slice(0, 300) : null }
const c = id => (id && color.has(id) ? `var(--a${color.get(id) % 8})` : 'var(--nobody)')
const sessions = () => S.state.repos.flatMap(r => r.sessions)
const nameOf = id => sessions().find(s => s.id === id)?.name ?? 'nobody'
const isDoc = rel => /\.(md|mdx|markdown)$/i.test(rel)

function side() {
  const st = S.state
  let h = `<h1><span class="pulse ${S.live ? '' : 'off'}"></span>Peers live</h1>`
  for (const r of st.repos) {
    h += `<div class="repo">${esc(r.name)}</div>`
    for (const s of r.sessions) {
      const n = r.files.filter(f => f.authors.includes(s.id)).length
      h += `<div class="sess ${S.only === s.id ? 'on' : ''}" data-only="${s.id}" style="--c:${c(s.id)}">
        <span class="dot ${Date.now() - s.updated < 60000 ? 'now' : ''}"></span>
        <div><div class="sname">${esc(s.name)}</div>${s.title ? `<div class="sub">${esc(s.title)}</div>` : ''}
        <div class="sub">${n} file${n === 1 ? '' : 's'} · ${ago(s.updated)} ago${s.commits.length ? ` · ${s.commits.length} commit${s.commits.length === 1 ? '' : 's'}` : ''}</div></div></div>`
    }
    const files = r.files.filter(f => !S.only || f.authors.includes(S.only))
    h += `<ul class="flist">${files.map(f => `<li class="${S.focus?.rel === f.rel && S.focus?.root === r.root ? 'on' : ''}" data-root="${esc(r.root)}" data-rel="${esc(f.rel)}">
      <span class="dots">${(f.authors.length ? f.authors : [null]).map(a => `<i style="--c:${c(a)}"></i>`).join('')}</span>${esc(f.rel)}</li>`).join('')}</ul>`
  }
  document.getElementById('side').innerHTML = h
}

function lines(f, cap) {
  let out = ''
  let n = 0
  for (const h of f.hunks) {
    if (cap && n >= cap) break
    out += `<div class="hunk-at">@@ ${h.new}${h.at ? ` · ${esc(h.at)}` : ''}</div>`
    for (const x of h.lines) {
      if (cap && n++ >= cap) break
      const dim = S.only && x.t !== ' ' && x.a !== S.only
      const cls = x.t === '+' ? 'add' : x.t === '-' ? 'del' : ''
      const col = x.t === ' ' ? '' : `--c:${dim ? 'var(--nobody)' : c(x.a)}`
      out += `<div class="ln ${cls}" style="${col}" title="${x.t === ' ' ? '' : esc(nameOf(x.a))}"><span class="g"></span><span class="s">${x.t === ' ' ? '' : x.t}</span><span>${esc(x.s) || ' '}</span></div>`
    }
  }
  return out
}

function card(r, f, full) {
  const id = `${r.root}\0${f.rel}`
  const total = f.hunks.reduce((n, h) => n + h.lines.length, 0)
  const cap = full || S.open.has(id) ? 0 : 160
  return `<section class="card"><header data-root="${esc(r.root)}" data-rel="${esc(f.rel)}">
    <span class="path">${esc(f.rel)}</span>${f.isNew ? '<span class="sub">new</span>' : ''}
    ${(f.authors.length ? f.authors : [null]).map(a => `<span class="chip" style="--c:${c(a)}">${esc(nameOf(a))}</span>`).join(' ')}
    <span class="sub" style="margin-left:auto">${ago(f.mtime)} ago</span></header>
    <div class="diff">${f.hunks.length ? lines(f, cap) : '<div class="more">no text diff (binary, empty or mode only)</div>'}</div>
    ${cap && total > cap ? `<div class="more" data-open="${esc(id)}">${total - cap} more lines</div>` : ''}</section>`
}

// Markdown in suggestion style: added text marked, removed text struck, each in its author's color.
function docHtml(d) {
  const by = (side, line) => d.authors[side][key(line)] ?? null
  const prefix = line => /^(\s*(?:[-*+]|\d+[.)])\s+(?:\[[ xX]\]\s+)?|\s*#{1,6}\s+|\s*>\s*)?/.exec(line)[0]
  const out = []
  let fence = false
  const push = l => { if (/^\s*(```|~~~)/.test(l)) fence = !fence; out.push(l) }
  const block = (cls, col, ls) => { out.push('', `<div class="${cls}" style="--c:${col}">`, '', ...ls, '', '</div>', '') }
  const split = t => t.replace(/\n$/, '').split('\n')
  const parts = Diff.diffLines(d.old, d.new)
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i]
    if (!p.added && !p.removed) { split(p.value).forEach(push); continue }
    const next = parts[i + 1]
    if (p.removed && next?.added) {
      const a = split(p.value), b = split(next.value)
      i++
      if (fence) { b.forEach(push); continue }
      // Line pairs get a word diff; the rest of a list stays in the list, other leftovers go in a block.
      const n = Math.min(a.length, b.length)
      const item = l => /^\s*([-*+]|\d+[.)])\s/.test(l)
      if (a.length === b.length || (a.slice(n).every(item) && b.slice(n).every(item))) {
        for (let j = 0; j < n; j++) {
          const pre = prefix(b[j]), col = c(by('added', b[j]) ?? by('removed', a[j]))
          const w = Diff.diffWordsWithSpace(a[j].slice(prefix(a[j]).length), b[j].slice(pre.length))
          push(pre + w.map(x => x.added ? `<mark style="--c:${col}">${esc(x.value)}</mark>` : x.removed ? `<del style="--c:${col}">${esc(x.value)}</del>` : esc(x.value)).join(''))
        }
        for (const l of b.slice(n)) push(`${prefix(l)}<mark style="--c:${c(by('added', l))}">${esc(l.slice(prefix(l).length))}</mark>`)
        for (const l of a.slice(n)) push(`${prefix(l)}<del style="--c:${c(by('removed', l))}">${esc(l.slice(prefix(l).length))}</del>`)
        continue
      }
      block('dels', c(by('removed', a.find(key) ?? '')), a.map(esc))
      block('ins', c(by('added', b.find(key) ?? '')), b)
      continue
    }
    const ls = split(p.value)
    if (fence) { if (p.added) ls.forEach(push); continue }
    if (p.removed) { block('dels', c(by('removed', ls.find(key) ?? '')), ls.map(esc)); continue }
    if (ls.length === 1 && ls[0].trim()) {
      const pre = prefix(ls[0])
      push(`${pre}<mark style="--c:${c(by('added', ls[0]))}">${esc(ls[0].slice(pre.length))}</mark>`)
    } else block('ins', c(by('added', ls.find(key) ?? '')), ls)
  }
  return marked.parse(out.join('\n'))
}

async function loadDoc(root, rel) {
  const r = await fetch(`/api/file?root=${encodeURIComponent(root)}&rel=${encodeURIComponent(rel)}`)
  if (r.ok) S.docs.set(`${root}\0${rel}`, await r.json())
}

function main() {
  const el = document.getElementById('main')
  const st = S.state
  if (S.focus) {
    const r = st.repos.find(x => x.root === S.focus.root)
    const f = r?.files.find(x => x.rel === S.focus.rel)
    const mode = S.mode ?? (isDoc(S.focus.rel) ? 'doc' : 'diff')
    let h = `<div class="bar"><button data-back>All changes</button>
      <button data-mode="doc" class="${mode === 'doc' ? 'on' : ''}">Document</button>
      <button data-mode="diff" class="${mode === 'diff' ? 'on' : ''}">Diff</button>
      <span class="sub">${esc(r?.name ?? '')} / ${esc(S.focus.rel)}</span></div>`
    if (!f) h += '<div class="empty">Committed or reverted: nothing uncommitted in this file now.</div>'
    else if (mode === 'diff') h += card(r, f, true)
    else {
      const d = S.docs.get(`${r.root}\0${f.rel}`)
      h += d ? `<article class="doc">${isDoc(f.rel) ? docHtml(d) : `<pre>${esc(d.new)}</pre>`}</article>` : '<div class="empty">Loading…</div>'
    }
    el.innerHTML = h
    return
  }
  const cards = []
  for (const r of st.repos) for (const f of r.files) if (!S.only || f.authors.includes(S.only)) cards.push(card(r, f, false))
  el.innerHTML = `<div class="legend">Every uncommitted change in the live sessions' repos, newest first. Each line is in its author's color; grey is nobody's. Click a file to open it.${S.only ? ` Showing ${esc(nameOf(S.only))} only.` : ''}</div>`
    + (cards.join('') || '<div class="empty">No uncommitted changes.</div>')
}

async function render() {
  if (!S.state) return
  for (const s of sessions()) if (!color.has(s.id)) color.set(s.id, color.size)
  if (S.focus && (S.mode ?? (isDoc(S.focus.rel) ? 'doc' : 'diff')) === 'doc') {
    const f = S.state.repos.find(x => x.root === S.focus.root)?.files.find(x => x.rel === S.focus.rel)
    const k = `${S.focus.root}\0${S.focus.rel}`
    if (f && (!S.docs.has(k) || S.docs.get(k).mtime !== f.mtime)) { await loadDoc(S.focus.root, S.focus.rel); if (S.docs.has(k)) S.docs.get(k).mtime = f.mtime }
  }
  side()
  main()
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-rel],[data-only],[data-back],[data-mode],[data-open]')
  if (!t) return
  if (t.dataset.only) S.only = S.only === t.dataset.only ? null : t.dataset.only
  else if (t.dataset.back !== undefined) { S.focus = null; S.mode = null }
  else if (t.dataset.mode) S.mode = t.dataset.mode
  else if (t.dataset.open) S.open.add(t.dataset.open)
  else { S.focus = { root: t.dataset.root, rel: t.dataset.rel }; S.mode = null; scrollTo(0, 0) }
  render()
})

const es = new EventSource('/events')
es.onopen = () => { S.live = true; if (S.state) side() }
es.onerror = () => { S.live = false; if (S.state) side() }
es.onmessage = m => { S.state = JSON.parse(m.data); render() }
setInterval(() => S.state && side(), 15000)
</script>
</body>
</html>
