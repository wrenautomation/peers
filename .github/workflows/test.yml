# The unit tests on macOS, Linux and Windows: Windows paths (`C:\x`), no perl, no ps, no symlinks.
name: test
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.email t@t && git config --global user.name t
      - run: node lib/core.test.mjs
      - run: node lib/tui.test.mjs
      - run: node lib/board.test.mjs
      - run: node lib/actions.test.mjs
      - run: node lib/view.test.mjs
      - run: node lib/platform.test.mjs
      # The supervisor for real on Windows: write the shims as the mod does, install, check, remove.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module -e "
            import { homedir } from 'node:os'; import { mkdirSync, writeFileSync } from 'node:fs'; import { resolve } from 'node:path'
            import { homeOf, slash } from './lib/path.mjs'; import { platform } from './lib/platform.mjs'
            const s = platform('win32').shims(homeOf(homedir()), slash(resolve('bin/peers.mjs'), true))
            mkdirSync(s.dir, { recursive: true }); for (const [p, t] of s.files) writeFileSync(p, t)"
          node bin/peers.mjs view --install
          node bin/peers.mjs doctor || true
          node bin/peers.mjs doctor | grep -E 'server: .*supervised'
          node bin/peers.mjs view --uninstall
          ! curl -s -m 2 http://127.0.0.1:6421/api/ping
